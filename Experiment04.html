<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4</title>
</head>
<body>
    <center>
    <form action="">
    <Fieldset>
        <center>
        <legend><h1>Hotel Room Booking Form</h1></legend>
        </center>

        <label for="name">Full Name: </label>
        <input type="text" name="name" id="name" placeholder="Enter your name"><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Enter your email"><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" name="phone" id="phone" placeholder="Enter your Phone no."><br><br>

        <label for="date">Check-in Date:</label>
        <input type="date" name="date1" id="date1"><br><br>

        <label for="date">Check-out Date:</label>
        <input type="date" name="date2" id="date2"><br><br>

        <label for="room">Room-type :</label>
        <select name="room" id="room">
            <option value="">Select</option>
            <option value="room1">One-seater</option>
            <option value="room2">two-seater</option>
            <option value="room3">three-seater</option>
            <option value="room4">four-seater</option>
        </select><br><br>

        <label for="guestno">Number of Guest:</label>
        <input type="number" name="guest" id="guestno" placeholder="Enter no. of Guests"><br><br>

        <label for="request">Any special request</label><br>
        <textarea name="request" id="request" placeholder="Any special request"></textarea><br><br>

        <input type="button" value="Book now" />&emsp;
        <input type="button" value="Reset" />

    </Fieldset>
    </form>
    </center>
</body>
</html>
